<text x="624" y="288" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555" text-anchor="start" font-style="italic">lee al arrancar, escribe en cada micro-lote</text>
<rect x="954" y="306" width="422" height="136" rx="12" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="2"/>
<text x="968" y="328" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#444444" text-anchor="start" letter-spacing="0.8">ORDEN DE CADA MICRO-LOTE</text>
<text x="968" y="354" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B1B1B" text-anchor="start">1. Anotar en offsets qué archivos va a leer</text>
<text x="968" y="374" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B1B1B" text-anchor="start">2. Calcular y guardar en el destino (cambios y tabla)</text>
<text x="968" y="394" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B1B1B" text-anchor="start">3. Confirmar en commits</text>
<text x="968" y="422" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#8A5A00" text-anchor="start">Si se cae entre 1 y 3, al reiniciar se repite el micro-lote N.</text>
<line x1="24" y1="464" x2="1376" y2="464" stroke="#DDD"/>
<text x="24" y="490" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="start">Qué protege en cada caso (pruebas del notebook 06)</text>
<rect x="24" y="506" width="329" height="104" rx="9" fill="#FFF3DC" stroke="#C98A1B" stroke-width="1.5"/>
<text x="36" y="530" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1B1B" text-anchor="start">Parada y reinicio</text>
<text x="36" y="551" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">Checkpoint: sigue en el lote</text>
<text x="36" y="568" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">siguiente y no relee ninguno.</text>
<rect x="365" y="506" width="329" height="104" rx="9" fill="#E4F4EC" stroke="#2E8B6A" stroke-width="1.5"/>
<text x="377" y="530" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1B1B" text-anchor="start">Caída mientras escribe</text>
<text x="377" y="551" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">El micro-lote no queda confirmado,</text>
<text x="377" y="568" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">Spark lo repite y el destino</text>
<text x="377" y="585" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">reemplaza: nada se duplica.</text>
<rect x="706" y="506" width="329" height="104" rx="9" fill="#EFE8FB" stroke="#7A4FB5" stroke-width="1.5"/>
<text x="718" y="530" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1B1B" text-anchor="start">El mismo lote otra vez</text>
<text x="718" y="551" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">Mismo nombre: no se lee (sources).</text>
<text x="718" y="568" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">Otro nombre: la deduplicación o la</text>
<text x="718" y="585" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">marca de agua lo descartan.</text>
<rect x="1047" y="506" width="329" height="104" rx="9" fill="#E4F4EC" stroke="#2E8B6A" stroke-width="1.5"/>
<text x="1059" y="530" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1B1B" text-anchor="start">El flujo completo otra vez</text>
<text x="1059" y="551" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">Mismo checkpoint: no lee nada.</text>
<text x="1059" y="568" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">Checkpoint borrado: relee todo y</text>
<text x="1059" y="585" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">el destino reemplaza cada ventana.</text>
<text x="24" y="638" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">En los tres escenarios de fallo (T3.4) la tabla final tiene 3.735 ventanas y 529.326 contratos, igual que la ejecución sin interrupciones y que el cálculo por lotes.</text>
<text x="24" y="658" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#555" text-anchor="start">Los 866 contratos restantes llegaron fuera de la tolerancia y quedan registrados aparte en streaming/tardios/. Cifras de la ejecución del 16-nov-2026.</text>
</svg>

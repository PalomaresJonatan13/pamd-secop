<text x="634" y="146" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1B1B" text-anchor="start">2 · Ventanas mensuales</text>
<text x="634" y="167" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">mes × departamento, modo update</text>

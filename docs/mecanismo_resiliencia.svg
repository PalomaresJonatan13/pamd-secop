<text x="360" y="167" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">clave del contrato (T1.1):</text>
<text x="360" y="184" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">id_del_proceso + id_adjudicacion</text>
<text x="360" y="201" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">descarta los contratos ya vistos</text>

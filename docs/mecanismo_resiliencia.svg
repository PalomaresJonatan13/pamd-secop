<text x="628" y="402" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">y acumulados</text>
<rect x="750" y="340" width="126" height="88" rx="9" fill="#FFF3DC" stroke="#C98A1B" stroke-width="1.5"/>
<text x="762" y="364" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#8A5A00" text-anchor="start">commits</text>
<text x="762" y="385" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">lote terminado;</text>
<text x="762" y="402" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">se anota DESPUÉS</text>

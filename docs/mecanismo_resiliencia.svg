<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="1400" height="676" fill="#FFFFFF"/>
<text x="24" y="36" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B1B1B" text-anchor="start">Resiliencia e idempotencia del flujo (Corte 3, Punto 3)</text>
<text x="24" y="60" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="start">El resultado es el mismo aunque el flujo se detenga, se caiga mientras escribe o reciba dos veces los mismos lotes. Las rutas son carpetas del bucket rawdata de MinIO.</text>
